name: Update Vector Store (Qdrant)

on:
  deployment_status:

  # Allow manual triggering with custom slugs
  workflow_dispatch:
    inputs:
      upsert_slugs:
        description: "Comma-separated slugs to upsert (e.g. api,closure)"
        required: false
      delete_slugs:
        description: "Comma-separated slugs to delete (e.g. old-term)"
        required: false

concurrency:
  group: vector-store-production
  cancel-in-progress: false

jobs:
  update-vector-store:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    # Only run on successful production deployments (or manual trigger)
    if: >
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      ) ||
      (
        github.event.deployment_status.state == 'success' &&
        github.event.deployment.environment == 'Production'
      )

    steps:
      - name: Read deployed content revision
        if: github.event_name == 'deployment_status'
        id: revision
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const status = context.payload.deployment_status;
            const urls = [status.environment_url, status.target_url].filter(Boolean);
            let manifest;
            let lastError;

            for (const baseUrl of urls) {
              try {
                const manifestUrl = new URL('/content-revision.json', baseUrl);
                const response = await fetch(manifestUrl);
                if (!response.ok) {
                  throw new Error(`Manifest request failed: ${response.status} ${response.statusText}`);
                }
                manifest = await response.json();
                break;
              } catch (error) {
                lastError = error;
              }
            }

            if (!manifest) {
              throw new Error(`Unable to read content revision manifest: ${lastError?.message ?? 'deployment URL missing'}`);
            }
            if (manifest.repository !== 'jargonsdev/content' || manifest.branch !== 'main') {
              throw new Error(`Unexpected content source ${manifest.repository}@${manifest.branch}`);
            }
            if (!/^[0-9a-f]{40}$/i.test(manifest.sha)) {
              throw new Error(`Invalid content commit SHA: ${manifest.sha}`);
            }

            core.setOutput('content_sha', manifest.sha);

      # ── Checkout app and content repositories ───────────────────────────
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          fetch-depth: 2

      - name: Checkout content repository
        if: github.event_name == 'deployment_status'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jargonsdev/content
          ref: ${{ steps.revision.outputs.content_sha }}
          path: content
          fetch-depth: 0
          persist-credentials: false

      - name: Read last indexed content revision
        if: github.event_name == 'deployment_status'
        id: marker
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            try {
              const { value } = await github.rest.actions.getRepoVariable({
                ...context.repo,
                name: 'LAST_INDEXED_CONTENT_SHA',
              });
              core.setOutput('sha', value);
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('sha', '');
            }

      - name: Detect changed dictionary files
        id: detect
        env:
          MANUAL_UPSERT_SLUGS: ${{ github.event.inputs.upsert_slugs }}
          MANUAL_DELETE_SLUGS: ${{ github.event.inputs.delete_slugs }}
          LAST_INDEXED_CONTENT_SHA: ${{ steps.marker.outputs.sha }}
          CONTENT_SHA: ${{ steps.revision.outputs.content_sha }}
        run: |
          validate_slug_list() {
            local slug_list="$1"

            if [ -z "$slug_list" ] || [[ "$slug_list" =~ ^[a-z0-9]+(-[a-z0-9]+)*(,[a-z0-9]+(-[a-z0-9]+)*)*$ ]]; then
              return 0
            fi

            echo "::error::Slugs must be lowercase letters and digits separated by single hyphens."
            return 1
          }

          UPSERT_SLUGS=""
          DELETE_SLUGS=""
          ADVANCE_MARKER="false"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            UPSERT_SLUGS="$MANUAL_UPSERT_SLUGS"
            DELETE_SLUGS="$MANUAL_DELETE_SLUGS"
          else
            if [ -z "$CONTENT_SHA" ]; then
              echo "::error::Content revision is missing from the deployment manifest."
              exit 1
            fi

            ADVANCE_MARKER="true"

            if [ -z "$LAST_INDEXED_CONTENT_SHA" ]; then
              echo "No previously indexed content SHA. Indexing the full dictionary."
              while IFS= read -r file; do
                slug=$(basename "$file" .mdx)
                UPSERT_SLUGS="${UPSERT_SLUGS:+$UPSERT_SLUGS,}$slug"
              done < <(find content/dictionary -type f -name '*.mdx' | sort)
            else
              if ! [[ "$LAST_INDEXED_CONTENT_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git -C content cat-file -e "${LAST_INDEXED_CONTENT_SHA}^{commit}"; then
                echo "::error::LAST_INDEXED_CONTENT_SHA is invalid or missing from content history. Clear the variable to trigger a full dictionary index."
                exit 1
              fi

              if ! git -C content merge-base --is-ancestor "$LAST_INDEXED_CONTENT_SHA" "$CONTENT_SHA"; then
                if git -C content merge-base --is-ancestor "$CONTENT_SHA" "$LAST_INDEXED_CONTENT_SHA"; then
                  echo "This deployment contains an older content revision than the one already indexed. Skipping it without changing the marker."
                  ADVANCE_MARKER="false"
                  printf 'has_changes=false\n' >> "$GITHUB_OUTPUT"
                  printf 'advance_marker=%s\n' "$ADVANCE_MARKER" >> "$GITHUB_OUTPUT"
                  exit 0
                fi

                echo "::error::Deployed content and LAST_INDEXED_CONTENT_SHA have diverged. Inspect the content history and marker."
                exit 1
              fi

              echo "Detecting dictionary changes from $LAST_INDEXED_CONTENT_SHA to $CONTENT_SHA..."
              while IFS=$'\t' read -r status old_path new_path; do
                case "$status" in
                  A|M|T|U)
                    slug=$(basename "$old_path" .mdx)
                    UPSERT_SLUGS="${UPSERT_SLUGS:+$UPSERT_SLUGS,}$slug"
                    ;;
                  D)
                    slug=$(basename "$old_path" .mdx)
                    DELETE_SLUGS="${DELETE_SLUGS:+$DELETE_SLUGS,}$slug"
                    ;;
                  R*|C*)
                    old_slug=$(basename "$old_path" .mdx)
                    new_slug=$(basename "$new_path" .mdx)
                    DELETE_SLUGS="${DELETE_SLUGS:+$DELETE_SLUGS,}$old_slug"
                    UPSERT_SLUGS="${UPSERT_SLUGS:+$UPSERT_SLUGS,}$new_slug"
                    ;;
                esac
              done < <(git -C content diff --name-status "$LAST_INDEXED_CONTENT_SHA" "$CONTENT_SHA" -- dictionary/)
          fi

          if ! validate_slug_list "$UPSERT_SLUGS" || ! validate_slug_list "$DELETE_SLUGS"; then
            exit 1
          fi

          printf 'upsert=%s\n' "$UPSERT_SLUGS" >> "$GITHUB_OUTPUT"
          printf 'delete=%s\n' "$DELETE_SLUGS" >> "$GITHUB_OUTPUT"
          printf 'content_sha=%s\n' "$CONTENT_SHA" >> "$GITHUB_OUTPUT"
          printf 'advance_marker=%s\n' "$ADVANCE_MARKER" >> "$GITHUB_OUTPUT"

          if [ -z "$UPSERT_SLUGS" ] && [ -z "$DELETE_SLUGS" ]; then
            printf 'has_changes=false\n' >> "$GITHUB_OUTPUT"
            echo "No dictionary file changes detected. Skipping update."
          else
            printf 'has_changes=true\n' >> "$GITHUB_OUTPUT"
            echo "Dictionary changes detected."
          fi

      - name: Skip — no dictionary changes
        if: steps.detect.outputs.has_changes != 'true'
        run: echo "No dictionary changes to process. Skipping vector update."

      - name: Setup Node.js
        if: steps.detect.outputs.has_changes == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.detect.outputs.has_changes == 'true'
        run: npx --yes npm@11.15.0 ci

      - name: Update vector store
        if: steps.detect.outputs.has_changes == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EMBEDDINGS_MODEL: ${{ vars.OPENAI_EMBEDDINGS_MODEL }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          UPSERT_SLUGS: ${{ steps.detect.outputs.upsert }}
          DELETE_SLUGS: ${{ steps.detect.outputs.delete }}
        run: |
          ARGS=()

          if [ -n "$UPSERT_SLUGS" ]; then
            ARGS+=(--upsert "$UPSERT_SLUGS")
          fi

          if [ -n "$DELETE_SLUGS" ]; then
            ARGS+=(--delete "$DELETE_SLUGS")
          fi

          echo "Running incremental vector store update."
          npm run update:jai:ci -- "${ARGS[@]}"

      - name: Update successful
        if: success() && github.event_name == 'deployment_status' && steps.detect.outputs.advance_marker == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CONTENT_SHA: ${{ steps.detect.outputs.content_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const variable = {
              owner,
              repo,
              name: 'LAST_INDEXED_CONTENT_SHA',
              value: process.env.CONTENT_SHA,
            };

            if (!variable.value) {
              throw new Error('Content SHA is missing; refusing to advance the index marker.');
            }

            try {
              await github.rest.actions.updateRepoVariable(variable);
              core.info(`Updated LAST_INDEXED_CONTENT_SHA to ${variable.value}`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.actions.createRepoVariable(variable);
              core.info(`Created LAST_INDEXED_CONTENT_SHA at ${variable.value}`);
            }
